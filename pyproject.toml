[project]
name = "courses-scraper"
version = "0.1.0"
description = "Courses Scraper"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "requests>=2.34.2,<3",
    "beautifulsoup4>=4.15.0,<5",
    "lxml>=6.1.2,<7",
    "pandas>=3.0.5,<4",
    "tqdm>=4.70.0,<5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1,<3",
    "ruff>=0.16.5,<1",
    "lxml-stubs>=0.5.1",
    "pandas-stubs>=3.0.5.260730,<4",
    "types-tqdm>=4.70.0.20260827,<5",
    "types-beautifulsoup4>=4.12.0.20250516,<5",
    "types-requests>=2.33.0.20260712,<3",
    "pytest>=9,<10",
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "UP",
    "YTT",
    "ANN",
    "ASYNC",
    "S",
    "B",
    "COM",
    "C4",
    "DTZ",
    "FA",
    "ISC",
    "ICN",
    "G",
    "INP",
    "PIE",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "TID",
    "PTH",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    "PERF",
    "FURB",
    "LOG",
    "RUF",
]
ignore = ["PLR2004", "PLR0912", "PLR0915", "TRY003", "PLR0911", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "SLF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

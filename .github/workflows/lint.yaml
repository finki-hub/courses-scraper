name: Linters

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    uses: finki-hub/.github/.github/workflows/ruff.yaml@main

  mypy:
    uses: finki-hub/.github/.github/workflows/mypy.yaml@main

  pytest:
    uses: finki-hub/.github/.github/workflows/pytest.yaml@main
